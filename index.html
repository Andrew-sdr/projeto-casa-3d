<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>Casa 3D - Dual Joystick</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
        
        body {
            overflow: hidden;
            background: #000;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* ===== JOYSTICKS ===== */
        .joystick-zone {
            position: fixed;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            z-index: 20;
            touch-action: none;
            background: radial-gradient(circle at 30% 30%, 
                rgba(255,255,255,0.15) 0%, 
                rgba(255,255,255,0.05) 50%,
                rgba(0,0,0,0.2) 100%
            );
            border: 2px solid rgba(255,255,255,0.15);
            box-shadow: 
                0 0 30px rgba(0,0,0,0.5),
                inset 0 0 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        
        .joystick-zone::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
        }
        
        .joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, 
                rgba(255,255,255,0.5) 0%, 
                rgba(255,255,255,0.1) 100%
            );
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 
                0 0 20px rgba(0,0,0,0.3),
                inset 0 -2px 10px rgba(0,0,0,0.2);
            border: 2px solid rgba(255,255,255,0.2);
            transition: box-shadow 0.2s;
        }
        
        .joystick-knob.active {
            box-shadow: 
                0 0 30px rgba(100, 200, 255, 0.3),
                inset 0 -2px 10px rgba(0,0,0,0.2);
            border-color: rgba(100, 200, 255, 0.4);
        }
        
        .joystick-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
            white-space: nowrap;
        }
        
        .joystick-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            opacity: 0.3;
            pointer-events: none;
            fill: rgba(255,255,255,0.3);
        }
        
        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 500px) {
            .joystick-zone {
                width: 120px;
                height: 120px;
            }
            .joystick-knob {
                width: 40px;
                height: 40px;
            }
            .joystick-label {
                font-size: 9px;
                bottom: -25px;
            }
            #info {
                font-size: 9px;
                padding: 6px 12px;
                bottom: 10px;
            }
        }
        
        @media (max-width: 400px) {
            .joystick-zone {
                width: 100px;
                height: 100px;
            }
            .joystick-knob {
                width: 35px;
                height: 35px;
            }
        }
        
        @media (orientation: landscape) and (max-height: 500px) {
            .joystick-zone {
                width: 110px;
                height: 110px;
            }
            .joystick-knob {
                width: 38px;
                height: 38px;
            }
            .joystick-label {
                font-size: 8px;
                bottom: -22px;
            }
            #info {
                font-size: 8px;
                padding: 4px 10px;
                bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="info">🎮 Esquerdo: andar | Direito: olhar</div>
        
        <!-- Joystick Esquerdo - Movimento -->
        <div id="joystick-move" class="joystick-zone">
            <div class="joystick-knob" id="knob-move">
                <svg class="joystick-icon" viewBox="0 0 24 24">
                    <path d="M12 2C12 2 8 8 8 12C8 14.2 9.8 16 12 16C14.2 16 16 14.2 16 12C16 8 12 2 12 2Z"/>
                    <path d="M12 8L9 11H11V15H13V11H15L12 8Z"/>
                </svg>
            </div>
            <div class="joystick-label">Movimento</div>
        </div>
        
        <!-- Joystick Direito - Câmera -->
        <div id="joystick-look" class="joystick-zone">
            <div class="joystick-knob" id="knob-look">
                <svg class="joystick-icon" viewBox="0 0 24 24">
                    <path d="M12 2C12 2 8 8 8 12C8 14.2 9.8 16 12 16C14.2 16 16 14.2 16 12C16 8 12 2 12 2Z"/>
                    <circle cx="12" cy="12" r="2"/>
                </svg>
            </div>
            <div class="joystick-label">Câmera</div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ============================================================
    // 1. CENA 3D
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // ============================================================
    // 2. LUZES
    // ============================================================
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    
    const sun = new THREE.DirectionalLight(0xffeedd, 1.5);
    sun.position.set(10, 20, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    scene.add(sun);

    const fillLight = new THREE.DirectionalLight(0x88ccff, 0.3);
    fillLight.position.set(-10, 5, 10);
    scene.add(fillLight);

    // ============================================================
    // 3. CHÃO
    // ============================================================
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 20),
        new THREE.MeshStandardMaterial({ 
            color: 0x8BAA8B,
            roughness: 0.8,
            metalness: 0.1
        })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(20, 20, 0x88aaff, 0x445588);
    grid.position.y = -0.49;
    scene.add(grid);

    // ============================================================
    // 4. MODELO 3D
    // ============================================================
    const loader = new GLTFLoader();
    let model = null;

    loader.load(
        './casa1.glb',
        (gltf) => {
            model = gltf.scene;
            model.position.set(0, 0, -2);
            model.scale.set(0.5, 0.5, 0.5);
            
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            
            scene.add(model);
            console.log('✅ Modelo carregado!');
            
            requestAnimationFrame(() => {
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const yBase = -0.5;
                const yCorrecao = yBase - (center.y - size.y / 2);
                model.position.y += yCorrecao;
                console.log(`📍 Altura ajustada: ${model.position.y.toFixed(2)}`);
            });
        },
        (xhr) => {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            console.log(`📦 ${percent}%`);
        },
        (error) => {
            console.error('❌ Erro:', error);
        }
    );

    // ============================================================
    // 5. SISTEMA DE DOIS JOYSTICKS COM REPOSICIONAMENTO
    // ============================================================
    
    const moveState = { x: 0, y: 0, active: false };
    const lookState = { x: 0, y: 0, active: false };
    
    let cameraRotationX = 0;
    let cameraRotationY = 0;

    // ===== FUNÇÃO PARA REPOSICIONAR JOYSTICKS =====
    function reposicionarJoysticks() {
        const moveZone = document.getElementById('joystick-move');
        const lookZone = document.getElementById('joystick-look');
        
        if (!moveZone || !lookZone) return;
        
        const isLandscape = window.innerWidth > window.innerHeight;
        const isSmall = window.innerWidth < 600 || window.innerHeight < 500;
        
        // Tamanho base
        let size = 150;
        let knobSize = 50;
        let bottomOffset = 40;
        let sideOffset = 40;
        
        if (isSmall) {
            size = 110;
            knobSize = 38;
            bottomOffset = 20;
            sideOffset = 20;
        } else if (window.innerWidth < 500) {
            size = 120;
            knobSize = 40;
            bottomOffset = 30;
            sideOffset = 30;
        }
        
        // Ajustes para paisagem
        if (isLandscape) {
            size = Math.min(size, window.innerHeight * 0.3);
            knobSize = Math.min(knobSize, size * 0.35);
            bottomOffset = Math.max(10, window.innerHeight * 0.05);
            sideOffset = Math.max(10, window.innerWidth * 0.05);
        }
        
        // Aplicar tamanhos
        moveZone.style.width = size + 'px';
        moveZone.style.height = size + 'px';
        lookZone.style.width = size + 'px';
        lookZone.style.height = size + 'px';
        
        // Ajustar knob
        document.querySelectorAll('.joystick-knob').forEach(k => {
            k.style.width = knobSize + 'px';
            k.style.height = knobSize + 'px';
        });
        
        // Posicionar
        moveZone.style.bottom = bottomOffset + 'px';
        moveZone.style.left = sideOffset + 'px';
        moveZone.style.top = 'auto';
        moveZone.style.right = 'auto';
        
        lookZone.style.bottom = bottomOffset + 'px';
        lookZone.style.right = sideOffset + 'px';
        lookZone.style.top = 'auto';
        lookZone.style.left = 'auto';
        
        // Ajustar labels
        document.querySelectorAll('.joystick-label').forEach(label => {
            const fontSize = isSmall ? '8px' : (isLandscape ? '9px' : '11px');
            label.style.fontSize = fontSize;
            label.style.bottom = (isSmall ? '-20px' : (isLandscape ? '-22px' : '-30px'));
        });
        
        console.log(`📱 Reposicionado: ${isLandscape ? 'Paisagem' : 'Retrato'} | Tamanho: ${size}px`);
    }

    // ===== FUNÇÃO PARA CONFIGURAR JOYSTICK =====
    function setupJoystick(zoneId, knobId, state) {
        const zone = document.getElementById(zoneId);
        const knob = document.getElementById(knobId);
        
        if (!zone || !knob) return;
        
        function getCenter() {
            const rect = zone.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2,
                maxDist: Math.min(rect.width, rect.height) * 0.35
            };
        }
        
        function updateKnob(touchX, touchY) {
            const center = getCenter();
            const deltaX = touchX - center.x;
            const deltaY = touchY - center.y;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxDist = center.maxDist;
            
            if (distance > maxDist) {
                state.x = (deltaX / distance) * 1.0;
                state.y = (deltaY / distance) * 1.0;
                const angle = Math.atan2(deltaY, deltaX);
                const newX = Math.cos(angle) * maxDist;
                const newY = Math.sin(angle) * maxDist;
                knob.style.transform = `translate(${-50 + (newX / maxDist) * 50}%, ${-50 + (newY / maxDist) * 50}%)`;
            } else {
                state.x = (deltaX / maxDist) * 1.0;
                state.y = (deltaY / maxDist) * 1.0;
                knob.style.transform = `translate(${-50 + (deltaX / maxDist) * 50}%, ${-50 + (deltaY / maxDist) * 50}%)`;
            }
            
            if (Math.abs(state.x) > 0.05 || Math.abs(state.y) > 0.05) {
                knob.classList.add('active');
            } else {
                knob.classList.remove('active');
            }
        }
        
        function resetKnob() {
            state.x = 0;
            state.y = 0;
            state.active = false;
            knob.style.transform = 'translate(-50%, -50%)';
            knob.classList.remove('active');
        }
        
        zone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            state.active = true;
            const touch = e.touches[0];
            updateKnob(touch.clientX, touch.clientY);
        });
        
        zone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!state.active) return;
            const touch = e.touches[0];
            updateKnob(touch.clientX, touch.clientY);
        });
        
        zone.addEventListener('touchend', (e) => {
            e.preventDefault();
            state.active = false;
            resetKnob();
        });
        
        zone.addEventListener('touchcancel', () => {
            state.active = false;
            resetKnob();
        });
        
        // Suporte a mouse
        let isMouseDown = false;
        zone.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            state.active = true;
            updateKnob(e.clientX, e.clientY);
        });
        
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown || !state.active) return;
            updateKnob(e.clientX, e.clientY);
        });
        
        window.addEventListener('mouseup', () => {
            if (isMouseDown) {
                isMouseDown = false;
                state.active = false;
                resetKnob();
            }
        });
    }

    // ===== INICIALIZAR =====
    setupJoystick('joystick-move', 'knob-move', moveState);
    setupJoystick('joystick-look', 'knob-look', lookState);
    
    // Posicionar inicialmente
    setTimeout(reposicionarJoysticks, 100);

    // ============================================================
    // 6. DETECÇÃO DE MUDANÇA DE ORIENTAÇÃO
    // ============================================================
    let orientationTimeout = null;
    
    window.addEventListener('resize', () => {
        // Debounce para evitar múltiplas chamadas
        clearTimeout(orientationTimeout);
        orientationTimeout = setTimeout(() => {
            reposicionarJoysticks();
            
            // Atualizar câmera
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, 300);
    });

    // Detectar orientação via API (se disponível)
    if (screen.orientation) {
        screen.orientation.addEventListener('change', () => {
            setTimeout(reposicionarJoysticks, 300);
        });
    }

    // ============================================================
    // 7. LOOP PRINCIPAL
    // ============================================================
    function animate() {
        requestAnimationFrame(animate);
        
        // Movimento
        if (moveState.active && (Math.abs(moveState.x) > 0.05 || Math.abs(moveState.y) > 0.05)) {
            const speed = 0.06;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0;
            forward.normalize();
            
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0;
            right.normalize();
            
            camera.position.add(forward.clone().multiplyScalar(-moveState.y * speed));
            camera.position.add(right.clone().multiplyScalar(moveState.x * speed));
            camera.position.y = 1.6;
        }
        
        // Câmera
        if (lookState.active && (Math.abs(lookState.x) > 0.05 || Math.abs(lookState.y) > 0.05)) {
            const sensitivity = 0.03;
            cameraRotationX -= lookState.x * sensitivity;
            cameraRotationY -= lookState.y * sensitivity;
            cameraRotationY = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, cameraRotationY));
            
            camera.rotation.order = 'YXZ';
            camera.rotation.y = cameraRotationX;
            camera.rotation.x = cameraRotationY;
        }
        
        renderer.render(scene, camera);
    }
    animate();

    // ============================================================
    // 8. PREVENÇÃO DE COMPORTAMENTOS INDESEJADOS
    // ============================================================
    document.addEventListener('touchmove', (e) => {
        if (e.target.closest('.joystick-zone') || e.target === renderer.domElement) {
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('contextmenu', (e) => e.preventDefault());

    console.log('🎮 Dual Joystick com suporte a paisagem!');
    console.log('📱 Vire o celular para testar o reposicionamento automático');
    </script>
</body>
</html>
