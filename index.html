<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>Modelo 3D com Joysticks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            overflow: hidden;
            background: #000;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-family: Arial;
            z-index: 999;
            flex-direction: column;
        }
        #loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* ===== JOYSTICKS ===== */
        .joystick-zone {
            position: fixed;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            z-index: 20;
            touch-action: none;
            background: radial-gradient(circle at 30% 30%, 
                rgba(255,255,255,0.15) 0%, 
                rgba(255,255,255,0.05) 50%,
                rgba(0,0,0,0.2) 100%
            );
            border: 2px solid rgba(255,255,255,0.15);
            box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, 
                rgba(255,255,255,0.5) 0%, 
                rgba(255,255,255,0.1) 100%
            );
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.3), inset 0 -2px 10px rgba(0,0,0,0.2);
            border: 2px solid rgba(255,255,255,0.2);
            transition: box-shadow 0.2s;
        }
        .joystick-knob.active {
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.3), inset 0 -2px 10px rgba(0,0,0,0.2);
            border-color: rgba(100, 200, 255, 0.4);
        }
        .joystick-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
            white-space: nowrap;
        }
        .joystick-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            opacity: 0.3;
            pointer-events: none;
            fill: rgba(255,255,255,0.3);
        }
        @media (max-width: 500px) {
            .joystick-zone { width: 120px; height: 120px; }
            .joystick-knob { width: 40px; height: 40px; }
            .joystick-label { font-size: 9px; bottom: -25px; }
            #info { font-size: 9px; padding: 6px 12px; bottom: 10px; }
        }
        @media (max-width: 400px) {
            .joystick-zone { width: 100px; height: 100px; }
            .joystick-knob { width: 35px; height: 35px; }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .joystick-zone { width: 110px; height: 110px; }
            .joystick-knob { width: 38px; height: 38px; }
            .joystick-label { font-size: 8px; bottom: -22px; }
            #info { font-size: 8px; padding: 4px 10px; bottom: 5px; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Carregando modelo 3D...</div>
        <div id="progress" style="font-size:14px;color:#888;margin-top:10px;"></div>
    </div>
    <div id="info">🎮 Joystick Esquerdo: andar | Direito: olhar</div>
    
    <!-- Joystick Esquerdo - Movimento -->
    <div id="joystick-move" class="joystick-zone">
        <div class="joystick-knob" id="knob-move">
            <svg class="joystick-icon" viewBox="0 0 24 24">
                <path d="M12 2C12 2 8 8 8 12C8 14.2 9.8 16 12 16C14.2 16 16 14.2 16 12C16 8 12 2 12 2Z"/>
                <path d="M12 8L9 11H11V15H13V11H15L12 8Z"/>
            </svg>
        </div>
        <div class="joystick-label">Movimento</div>
    </div>
    
    <!-- Joystick Direito - Câmera -->
    <div id="joystick-look" class="joystick-zone">
        <div class="joystick-knob" id="knob-look">
            <svg class="joystick-icon" viewBox="0 0 24 24">
                <path d="M12 2C12 2 8 8 8 12C8 14.2 9.8 16 12 16C14.2 16 16 14.2 16 12C16 8 12 2 12 2Z"/>
                <circle cx="12" cy="12" r="2"/>
            </svg>
        </div>
        <div class="joystick-label">Câmera</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>

    <script type="module">
    // ===== IMPORTAÇÕES =====
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ===== LOADING SCREEN =====
    const loadingDiv = document.getElementById('loading');
    const progressDiv = document.getElementById('progress');

    // ===== FÍSICAS =====
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.defaultContactMaterial.restitution = 0.1;

    // ===== CENA =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.65, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // ===== LUZES =====
    scene.add(new THREE.AmbientLight(0x404060, 0.5));

    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(10, 20, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    scene.add(sun);

    const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
    fillLight.position.set(-10, 0, 10);
    scene.add(fillLight);

    // ===== CHÃO =====
    console.log('🏗️ Criando chão...');
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 60),
        new THREE.MeshStandardMaterial({ color: 0x3a7d5c })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    const groundBody = new CANNON.Body({ mass: 0 });
    groundBody.addShape(new CANNON.Plane());
    groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    groundBody.position.set(0, -0.5, 0);
    world.addBody(groundBody);

    // ===== CARREGAR MODELO =====
    console.log('📦 Iniciando carregamento do modelo...');
    const loader = new GLTFLoader();
    
    const modelPath = './casa1.glb';

    console.log(`🔍 Tentando carregar: ${modelPath}`);

    loader.load(
        modelPath,
        (gltf) => {
            console.log('✅ MODELO CARREGADO COM SUCESSO!');
            const model = gltf.scene;
            
            model.position.set(0, -0.5, 0);
            model.scale.set(0.15, 0.15, 0.15);
            
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            
            scene.add(model);
            loadingDiv.style.display = 'none';
            console.log('🎉 Modelo adicionado à cena!');
        },
        (xhr) => {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            progressDiv.textContent = `${percent}%`;
            console.log(`📦 Carregando: ${percent}%`);
        },
        (error) => {
            console.error('❌ ERRO AO CARREGAR MODELO:', error);
            loadingDiv.innerHTML = `
                <div style="color:#ff4444;font-size:48px;margin-bottom:20px;">❌</div>
                <div style="color:white;">Erro ao carregar o modelo</div>
                <div style="color:#888;font-size:14px;margin-top:10px;max-width:400px;text-align:center;">
                    Verifique se o arquivo <b>casa1.glb</b> está na mesma pasta que este HTML.<br>
                    <span style="color:#ffaa00;">Detalhes:</span> ${error.message || 'Erro desconhecido'}
                </div>
                <button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;background:#4CAF50;color:white;border:none;border-radius:5px;cursor:pointer;font-size:16px;">
                    🔄 Tentar novamente
                </button>
            `;
        }
    );

    // ============================================================
    // PISO 2º ANDAR
    // ============================================================
    const alturaPiso2 = 4.2;
    
    const piso2Mat = new THREE.MeshStandardMaterial({ 
        color: 0x8B7D6B,
        roughness: 0.6,
        metalness: 0,
        transparent: true,
        opacity: 0.2
    });
    
    const piso2Mesh = new THREE.Mesh(
        new THREE.BoxGeometry(8, 0.3, 8),
        piso2Mat
    );
    piso2Mesh.position.set(0, alturaPiso2, 0);
    piso2Mesh.castShadow = true;
    piso2Mesh.receiveShadow = true;
    scene.add(piso2Mesh);

    const piso2Body = new CANNON.Body({ mass: 0 });
    piso2Body.addShape(new CANNON.Box(new CANNON.Vec3(4, 0.15, 4)));
    piso2Body.position.set(0, alturaPiso2, 0);
    world.addBody(piso2Body);

    // ============================================================
    // ESCADA EXTERNA
    // ============================================================
    const rampaMat = new THREE.MeshStandardMaterial({ 
        color: 0xCD853F,
        roughness: 0.7,
        metalness: 0.1,
        side: THREE.DoubleSide
    });

    // Rampa
    const rampaLargura = 3.0;
    const rampaAltura = alturaPiso2 + 0.5;
    const rampaComprimento = 5.5;
    const anguloRampa = Math.atan2(rampaAltura, rampaComprimento);

    // Visual da rampa
    const rampaMesh = new THREE.Mesh(
        new THREE.BoxGeometry(rampaLargura, 0.1, rampaComprimento),
        rampaMat
    );
        
    rampaMesh.position.set(6.5, -0.5 + rampaAltura/2, 0);
    rampaMesh.rotation.x = -anguloRampa;
    rampaMesh.castShadow = true;
    rampaMesh.receiveShadow = true;
    scene.add(rampaMesh);

    // Física da rampa
    const rampaBody = new CANNON.Body({ mass: 0 });
    rampaBody.addShape(new CANNON.Box(new CANNON.Vec3(rampaLargura/2, 0.05, rampaComprimento/2)));
    rampaBody.position.set(6.5, -0.5 + rampaAltura/2, 0);
    rampaBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -anguloRampa);
    world.addBody(rampaBody);

    // ============================================================
    // PERSONAGEM    
    // ============================================================
    const playerRadius = 0.3;
    const playerMat = new THREE.MeshStandardMaterial({ 
        color: 0xff4400,
        emissive: 0xff2200,
        emissiveIntensity: 0.1,
        roughness: 0.3,
        metalness: 0.1
    });
    const playerMesh = new THREE.Mesh(
        new THREE.SphereGeometry(playerRadius, 16, 16),
        playerMat
    );
    playerMesh.castShadow = true;
    scene.add(playerMesh);

    const playerBody = new CANNON.Body({
        mass: 2,
        shape: new CANNON.Sphere(playerRadius)
    });
    playerBody.position.set(2, 1.6, 0);
    playerBody.linearDamping = 0.95;
    playerBody.angularDamping = 0.95;
    world.addBody(playerBody);
    
    // ============================================================
    // SISTEMA DE DOIS JOYSTICKS
    // ============================================================
    
    const moveState = { x: 0, y: 0, active: false };
    const lookState = { x: 0, y: 0, active: false };
    
    let cameraRotationX = 0;
    let cameraRotationY = 0;

    // ===== REPOSICIONAR JOYSTICKS =====
    function reposicionarJoysticks() {
        const moveZone = document.getElementById('joystick-move');
        const lookZone = document.getElementById('joystick-look');
        if (!moveZone || !lookZone) return;
        
        const isLandscape = window.innerWidth > window.innerHeight;
        const isSmall = window.innerWidth < 600 || window.innerHeight < 500;
        
        let size = 150, knobSize = 50, bottomOffset = 40, sideOffset = 40;
        
        if (isSmall) { size = 110; knobSize = 38; bottomOffset = 20; sideOffset = 20; }
        else if (window.innerWidth < 500) { size = 120; knobSize = 40; bottomOffset = 30; sideOffset = 30; }
        
        if (isLandscape) {
            size = Math.min(size, window.innerHeight * 0.3);
            knobSize = Math.min(knobSize, size * 0.35);
            bottomOffset = Math.max(10, window.innerHeight * 0.05);
            sideOffset = Math.max(10, window.innerWidth * 0.05);
        }
        
        moveZone.style.width = size + 'px';
        moveZone.style.height = size + 'px';
        lookZone.style.width = size + 'px';
        lookZone.style.height = size + 'px';
        
        document.querySelectorAll('.joystick-knob').forEach(k => {
            k.style.width = knobSize + 'px';
            k.style.height = knobSize + 'px';
        });
        
        moveZone.style.bottom = bottomOffset + 'px';
        moveZone.style.left = sideOffset + 'px';
        moveZone.style.top = 'auto';
        moveZone.style.right = 'auto';
        
        lookZone.style.bottom = bottomOffset + 'px';
        lookZone.style.right = sideOffset + 'px';
        lookZone.style.top = 'auto';
        lookZone.style.left = 'auto';
    }

    // ===== CONFIGURAR JOYSTICK =====
    function setupJoystick(zoneId, knobId, state) {
        const zone = document.getElementById(zoneId);
        const knob = document.getElementById(knobId);
        if (!zone || !knob) return;
        
        function getCenter() {
            const rect = zone.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2,
                maxDist: Math.min(rect.width, rect.height) * 0.35
            };
        }
        
        function updateKnob(touchX, touchY) {
            const center = getCenter();
            const deltaX = touchX - center.x;
            const deltaY = touchY - center.y;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxDist = center.maxDist;
            
            if (distance > maxDist) {
                state.x = (deltaX / distance) * 1.0;
                state.y = (deltaY / distance) * 1.0;
                const angle = Math.atan2(deltaY, deltaX);
                const newX = Math.cos(angle) * maxDist;
                const newY = Math.sin(angle) * maxDist;
                knob.style.transform = `translate(${-50 + (newX / maxDist) * 50}%, ${-50 + (newY / maxDist) * 50}%)`;
            } else {
                state.x = (deltaX / maxDist) * 1.0;
                state.y = (deltaY / maxDist) * 1.0;
                knob.style.transform = `translate(${-50 + (deltaX / maxDist) * 50}%, ${-50 + (deltaY / maxDist) * 50}%)`;
            }
            
            if (Math.abs(state.x) > 0.05 || Math.abs(state.y) > 0.05) {
                knob.classList.add('active');
            } else {
                knob.classList.remove('active');
            }
        }
        
        function resetKnob() {
            state.x = 0; state.y = 0; state.active = false;
            knob.style.transform = 'translate(-50%, -50%)';
            knob.classList.remove('active');
        }
        
        zone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            state.active = true;
            const touch = e.touches[0];
            updateKnob(touch.clientX, touch.clientY);
        });
        
        zone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!state.active) return;
            const touch = e.touches[0];
            updateKnob(touch.clientX, touch.clientY);
        });
        
        zone.addEventListener('touchend', (e) => {
            e.preventDefault();
            state.active = false;
            resetKnob();
        });
        
        zone.addEventListener('touchcancel', () => {
            state.active = false;
            resetKnob();
        });
        
        // Suporte a mouse (para testes no desktop)
        let isMouseDown = false;
        zone.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            state.active = true;
            updateKnob(e.clientX, e.clientY);
        });
        
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown || !state.active) return;
            updateKnob(e.clientX, e.clientY);
        });
        
        window.addEventListener('mouseup', () => {
            if (isMouseDown) {
                isMouseDown = false;
                state.active = false;
                resetKnob();
            }
        });
    }

    // ===== INICIALIZAR JOYSTICKS =====
    setupJoystick('joystick-move', 'knob-move', moveState);
    setupJoystick('joystick-look', 'knob-look', lookState);
    setTimeout(reposicionarJoysticks, 100);

    // ===== DETECÇÃO DE MUDANÇA DE ORIENTAÇÃO =====
    window.addEventListener('resize', () => {
        reposicionarJoysticks();
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    if (screen.orientation) {
        screen.orientation.addEventListener('change', () => {
            setTimeout(reposicionarJoysticks, 300);
        });
    }

    // ===== LOOP PRINCIPAL =====
    let lastTime = 0;
    
    function animate() {
        requestAnimationFrame(animate);

        const delta = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;
        
        // MOVIMENTO
        if (moveState.active && (Math.abs(moveState.x) > 0.05 || Math.abs(moveState.y) > 0.05)) {
            const speed = 0.06;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0;
            forward.normalize();
            
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0;
            right.normalize();

            const forceX = (-moveState.y * forward.x + moveState.x * right.x) * speed;
            const forceZ = (-moveState.y * forward.z + moveState.x * right.z) * speed;
            
            playerBody.velocity.x = forceX;
            playerBody.velocity.z = forceZ;
        } else {
            playerBody.velocity.x *= 0.9;
            playerBody.velocity.z *= 0.9;
            camera.position.y = 1.65;
        }
        
        // ===== CÂMERA (Joystick Direito) =====
        if (lookState.active && (Math.abs(lookState.x) > 0.05 || Math.abs(lookState.y) > 0.05)) {
            const sensitivity = 0.03;
            cameraRotationX -= lookState.x * sensitivity;
            cameraRotationY -= lookState.y * sensitivity;
            cameraRotationY = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, cameraRotationY));
            
            camera.rotation.order = 'YXZ';
            camera.rotation.y = cameraRotationX;
            camera.rotation.x = cameraRotationY;
        }
        
        // Física
        world.step(1 / 60, delta, 3);

        // Seguir jogador
        const playerPos = playerBody.position;
        camera.position.set(
            playerPos.x,
            playerPos.y + 1.3,
            playerPos.z
        );
        camera.rotation.order = 'YXZ';
        camera.rotation.y = cameraRotationX;
        camera.rotation.x = cameraRotationY;

        playerMesh.position.copy(playerPos);
        
        renderer.render(scene, camera);
    }
    animate();

    // ===== PREVENÇÃO =====
    document.addEventListener('touchmove', (e) => {
        if (e.target.closest('.joystick-zone') || e.target === renderer.domElement) {
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('contextmenu', (e) => e.preventDefault());

    console.log('✅ Cena com joysticks iniciada!');
    console.log('📱 Teste no celular ou use o mouse para simular toque');
    </script>
</body>
</html>
