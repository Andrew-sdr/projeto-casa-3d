<!DOCTYPE html>
<html>
<head>
  <style> body { margin: 0; overflow: hidden; } </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// 1. Cena, Câmera, Renderizador
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111122);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true; // Para sombras realistas
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// 2. Controles
const controls = new PointerLockControls(camera, renderer.domElement);
document.addEventListener('click', () => controls.lock());

// 3. Iluminação
const ambientLight = new THREE.AmbientLight(0x404060);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x4488ff, 0.5);
fillLight.position.set(-5, 0, 5);
scene.add(fillLight);

// 4. Chão
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.MeshStandardMaterial({ color: 0x3a7d5c })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.5;
ground.receiveShadow = true;
scene.add(ground);

// 5. CARREGAR O MODELO GLB
const loader = new GLTFLoader();

loader.load(
  './casa1.glb',
  (gltf) => {
    const model = gltf.scene;
    
    // Ajustes no modelo
    model.position.set(0, 0.5, -2);
    model.scale.set(0.8, 0.8, 0.8);
    model.rotation.y = Math.PI / 4;
    
    // Ativar sombras no modelo
    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
    
    scene.add(model);
    console.log('✅ Modelo carregado!');
  },
  (xhr) => {
    // Progresso do carregamento
    console.log(`📦 Carregando: ${Math.round((xhr.loaded / xhr.total) * 100)}%`);
  },
  (error) => {
    console.error('❌ Erro ao carregar:', error);
  }
);

// 6. Adicionar esfera de referência
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff4400, emissiveIntensity: 0.3 })
);
sphere.position.set(0, 0.5, -2);
sphere.castShadow = true;
scene.add(sphere);

// 7. Loop
function animate() {
  requestAnimationFrame(animate);
  
  // Gira a esfera de referência (opcional)
  sphere.rotation.y += 0.01;
  
  renderer.render(scene, camera);
}
animate();

// 8. Ajuste de tela
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
