<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-family: Arial;
            z-index: 999;
            flex-direction: column;
        }
        #loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: Arial;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Carregando modelo 3D...</div>
        <div id="progress" style="font-size:14px;color:#888;margin-top:10px;"></div>
    </div>
    <div id="info">🖱️ Clique para travar o mouse | WASD para andar</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    // ===== IMPORTAÇÕES =====
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ===== LOADING SCREEN =====
    const loadingDiv = document.getElementById('loading');
    const progressDiv = document.getElementById('progress');

    // ===== CENA =====
    console.log('🎮 Iniciando cena 3D...');
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111122);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // ===== CONTROLES =====
    const controls = new PointerLockControls(camera, renderer.domElement);
    document.addEventListener('click', () => {
        controls.lock();
        console.log('🔒 Mouse travado');
    });

    // ===== LUZES =====
    console.log('💡 Configurando luzes...');
    scene.add(new THREE.AmbientLight(0x404060, 0.5));

    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(10, 20, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    scene.add(sun);

    const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
    fillLight.position.set(-10, 0, 10);
    scene.add(fillLight);

    // ===== CHÃO =====
    console.log('🏗️ Criando chão...');
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 60),
        new THREE.MeshStandardMaterial({ color: 0x3a7d5c })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    // ===== GRADE DE REFERÊNCIA =====
    const grid = new THREE.GridHelper(20, 20, 0x88aaff, 0x445588);
    grid.position.y = -0.49;
    scene.add(grid);

    // ===== CARREGAR MODELO =====
    console.log('📦 Iniciando carregamento do modelo...');
    const loader = new GLTFLoader();
    
    // OPÇÃO 1: Modelo na mesma pasta (RECOMENDADO)
    const modelPath = './casa1.glb';

    console.log(`🔍 Tentando carregar: ${modelPath}`);

    loader.load(
        modelPath,
        // ===== SUCESSO =====
        (gltf) => {
            console.log('✅ MODELO CARREGADO COM SUCESSO!');
            const model = gltf.scene;
            
            // Ajustar posição
            model.position.set(0, -0.5, 0);
            model.scale.set(0.2, 0.2, 0.2);
            
            // Ativar sombras
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            
            scene.add(model);
            
            // Remover loading
            loadingDiv.style.display = 'none';
            
            console.log('🎉 Modelo adicionado à cena!');
        },
        // ===== PROGRESSO =====
        (xhr) => {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            progressDiv.textContent = `${percent}%`;
            console.log(`📦 Carregando: ${percent}%`);
        },
        // ===== ERRO =====
        (error) => {
            console.error('❌ ERRO AO CARREGAR MODELO:', error);
            loadingDiv.innerHTML = `
                <div style="color:#ff4444;font-size:48px;margin-bottom:20px;">❌</div>
                <div style="color:white;">Erro ao carregar o modelo</div>
                <div style="color:#888;font-size:14px;margin-top:10px;max-width:400px;text-align:center;">
                    Verifique se o arquivo <b>casa.glb</b> está na mesma pasta que este HTML.<br>
                    <span style="color:#ffaa00;">Detalhes:</span> ${error.message || 'Erro desconhecido'}
                </div>
                <button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;background:#4CAF50;color:white;border:none;border-radius:5px;cursor:pointer;font-size:16px;">
                    🔄 Tentar novamente
                </button>
            `;
        }
    );

    // ===== MOVIMENTO WASD =====
    const keys = {};
    document.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    // ===== LOOP PRINCIPAL =====
    function animate() {
        requestAnimationFrame(animate);
        
        if (controls.isLocked) {
            const speed = 0.05;
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            const forward = new THREE.Vector3(direction.x, 0, direction.z).normalize();
            const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();
            
            if (keys['w']) camera.position.add(forward.clone().multiplyScalar(speed));
            if (keys['s']) camera.position.add(forward.clone().multiplyScalar(-speed));
            if (keys['a']) camera.position.add(right.clone().multiplyScalar(-speed));
            if (keys['d']) camera.position.add(right.clone().multiplyScalar(speed));
        }
        
        renderer.render(scene, camera);
    }
    animate();

    // ===== REDIMENSIONAMENTO =====
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log('✅ Cena iniciada com sucesso!');
    console.log('📋 Dicas:');
    console.log('  - Clique na tela para travar o mouse');
    console.log('  - WASD para andar');
    console.log('  - F12 para ver este console');
    </script>
</body>
</html>
